<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Crest</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
      /* --- DYNAMIC THEME & COLOR SYSTEM --- */
      :root {
        /* Default Theme (Misty Mountain) - All values are dynamically overridden by React */
        --accent-100: hsl(195, 40%, 96%);
        --accent-200: hsl(195, 50%, 88%);
        --accent-300: hsl(195, 60%, 77%);
        --accent-400: hsl(195, 70%, 66%);
        --accent-500: hsl(195, 80%, 56%);
        --accent-600: hsl(195, 90%, 48%);

        --bg-primary: transparent;
        --bg-secondary: rgba(12, 26, 46, 0.65);
        --bg-tertiary: #112233;
        --bg-quaternary: #1a334d;

        --text-primary: #f0f8ff;
        --text-secondary: #c0d8e8;
        --text-muted: #809bb1;

        --border-primary: rgba(45, 85, 125, 0.7);
        --border-secondary: #1a334d; /* Mapped from bg-quaternary for consistency */

        --shadow-accent: hsl(195, 80%, 56%, 0.1);
        
        /* Notes View Theming */
        --paper-color: rgba(17, 34, 51, 0.85);
        --line-color: rgba(45, 85, 125, 0.9);
        --paper-text-color: #dceefc;
        --paper-text-bold: hsl(195, 60%, 77%);
        --paper-placeholder: #809bb1;
        
        /* Browser View Bubbles */
        --user-bubble-bg: hsla(195, 80%, 56%, 0.2);
        --user-bubble-text: #f0f8ff;

        /* DYNAMIC BACKGROUND IMAGE - Injected by React */
        --background-image-url: url('https://images.unsplash.com/photo-1500534623283-312aade485b7?q=80&w=2670&auto=format&fit=crop');
        --background-filter: brightness(0.6) saturate(0.9);
      }

      /* Custom Fonts & Global Styles */
      body {
        font-family: 'Inter', sans-serif;
        color: var(--text-secondary);
        position: relative;
        overflow: hidden; /* Prevent body scrollbars */
        transition: color 0.5s ease-in-out;
      }
      .font-mono {
        font-family: 'JetBrains Mono', monospace;
      }

      /* Background Image & Overlay */
      body::before {
        content: '';
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background-image: var(--background-image-url);
        background-size: cover;
        background-position: center;
        z-index: -1;
        filter: var(--background-filter);
        transition: filter 0.5s ease-in-out, background-image 0.5s ease-in-out;
      }
      
      /* --- Intro Animation Styles --- */
      @keyframes animate-text-focus-crest {
          from { opacity: 0; transform: translateY(10px); letter-spacing: 10px; }
          to { opacity: 1; transform: translateY(0); letter-spacing: 2px; }
      }

      @keyframes draw-line-focus-crest {
          from { stroke-dashoffset: 120; }
          to { stroke-dashoffset: 0; }
      }

      #intro-logo #logo-text {
          opacity: 0;
          animation: animate-text-focus-crest 1.5s cubic-bezier(0.23, 1, 0.32, 1) 1.0s forwards;
      }

      #intro-logo #logo-underline {
          stroke-dasharray: 120; /* The length of the line: 170 - 50 */
          stroke-dashoffset: 120;
          animation: draw-line-focus-crest 1.2s cubic-bezier(0.65, 0, 0.35, 1) 0.5s forwards;
      }
      
      /* --- Transition from Intro to App --- */
      @keyframes fade-out {
        from { opacity: 1; }
        to { opacity: 0; pointer-events: none; }
      }
      .animate-fadeOut { animation: fade-out 0.8s cubic-bezier(0.65, 0, 0.35, 1) forwards; }

      @keyframes fade-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      .animate-fadeIn { animation: fade-in 0.8s cubic-bezier(0.23, 1, 0.32, 1) both; }
      
      /* View & Content Animations */
      @keyframes viewFadeIn {
        from {
          opacity: 0;
          transform: translateY(1rem) scale(0.98);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
      .animate-viewFadeIn { animation: viewFadeIn 0.5s cubic-bezier(0.23, 1, 0.32, 1) both; }

      @keyframes futuristicModalOpen {
        from { opacity: 0; transform: perspective(800px) translateY(50px) rotateX(-15deg) scale(0.95); filter: blur(8px); }
        to { opacity: 1; transform: perspective(800px) translateY(0) rotateX(0deg) scale(1); filter: blur(0); }
      }
      .animate-futuristicModalOpen { animation: futuristicModalOpen 0.5s cubic-bezier(0.23, 1, 0.32, 1) both; }

      @keyframes backdropFadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      .animate-backdropFadeIn { animation: backdropFadeIn 0.5s cubic-bezier(0.23, 1, 0.32, 1) both; }

      /* Texture Overlay for dark mode */
      .texture-overlay {
        position: relative;
      }
      .texture-overlay::before {
        content: "";
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.02'/%3E%3C/svg%3E");
        pointer-events: none;
        z-index: 0;
      }

      /* Notes View Paper Background */
      .paper-background {
        --line-height: 1.75rem;
        background-color: var(--paper-color);
        backdrop-filter: blur(10px);
        background-image: 
          repeating-linear-gradient(
              to bottom,
              transparent,
              transparent calc(var(--line-height) - 1px),
              var(--line-color) calc(var(--line-height) - 1px),
              var(--line-color) var(--line-height)
          );
        background-size: 100% var(--line-height);
        background-position-y: 0.75rem;
        line-height: var(--line-height);
        color: var(--paper-text-color);
      }
      
      .paper-background b, .paper-background strong { color: var(--paper-text-bold); }
      .paper-background i, .paper-background em { color: var(--paper-text-bold); }
      .paper-background u { text-decoration-color: var(--paper-text-bold); text-decoration-thickness: 1.5px; }

      .editor-placeholder:empty::before {
        content: attr(data-placeholder);
        color: var(--paper-placeholder);
        position: absolute;
        pointer-events: none;
        user-select: none;
        left: 1.5rem;
        top: 0.75rem;
      }

      /* Markdown Renderer Theming */
      .markdown-strong { color: var(--accent-300); }
      .markdown-em { color: var(--accent-200); }

    </style>
<!-- Removed complex import maps for Vercel deployment -->
<link rel="stylesheet" href="/index.css">
</head>
<body class="antialiased">
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
