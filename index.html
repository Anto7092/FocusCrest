<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Crest</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
      /* --- THEME & COLOR SYSTEM --- */
      :root {
        /* ACCENT COLORS - HSL components are injected by React */
        --color-accent-h: 158;
        --color-accent-s: 64%;
        --color-accent-l-100: 96%;
        --color-accent-l-200: 88%;
        --color-accent-l-300: 77%;
        --color-accent-l-400: 66%;
        --color-accent-l-500: 56%;
        --color-accent-l-600: 48%;

        --accent-100: hsl(var(--color-accent-h), var(--color-accent-s), var(--color-accent-l-100));
        --accent-200: hsl(var(--color-accent-h), var(--color-accent-s), var(--color-accent-l-200));
        --accent-300: hsl(var(--color-accent-h), var(--color-accent-s), var(--color-accent-l-300));
        --accent-400: hsl(var(--color-accent-h), var(--color-accent-s), var(--color-accent-l-400));
        --accent-500: hsl(var(--color-accent-h), var(--color-accent-s), var(--color-accent-l-500));
        --accent-600: hsl(var(--color-accent-h), var(--color-accent-s), var(--color-accent-l-600));
      }
      
      .theme-dark {
        --bg-primary: transparent; /* slate-950 */
        --bg-secondary: rgba(15, 23, 42, 0.65); /* slate-900 */
        --bg-tertiary: #1e293b; /* slate-800 */
        --bg-quaternary: #334155; /* slate-700 */

        --text-primary: #f1f5f9; /* slate-100 */
        --text-secondary: #cbd5e1; /* slate-300 */
        --text-muted: #64748b; /* slate-500 */
        --text-inverted: #0f172a; /* slate-900 */

        --border-primary: rgba(51, 65, 85, 0.7); /* slate-700 */
        --border-secondary: #475569; /* slate-600 */
        --border-accent: hsl(var(--color-accent-h), var(--color-accent-s), var(--color-accent-l-400) / 0.5);

        --shadow-accent: hsl(var(--color-accent-h) 95% 54% / 0.1);

        /* Notes View Theming */
        --paper-color: rgba(30, 41, 59, 0.85); /* slate-800 */
        --line-color: rgba(71, 85, 105, 0.9); /* slate-600 */
        --paper-text-color: #e2e8f0; /* slate-200 */
        --paper-text-bold: var(--accent-300);
        --paper-text-italic: var(--accent-300);
        --paper-text-underline: var(--accent-300);
        --paper-placeholder: #64748b; /* slate-500 */
        
        /* Browser View Bubbles */
        --user-bubble-bg: hsl(var(--color-accent-h) var(--color-accent-s) var(--color-accent-l-500) / 0.2);
        --user-bubble-text: var(--text-primary);
      }

      .theme-light {
        --bg-primary: transparent;
        --bg-secondary: rgba(253, 250, 245, 0.7); /* Warm, creamy off-white */
        --bg-tertiary: rgba(248, 244, 236, 1);
        --bg-quaternary: rgba(238, 233, 225, 1);

        --text-primary: #4a433d; /* Deep, warm brown for high contrast */
        --text-secondary: #6f6861; /* Mid-tone warm gray */
        --text-muted: #9c948b; /* Lighter warm gray for hints */
        --text-inverted: #ffffff;

        --border-primary: rgba(224, 215, 203, 0.7); /* Soft, warm border */
        --border-secondary: rgba(200, 190, 180, 1);
        --border-accent: hsl(var(--color-accent-h), var(--color-accent-s), var(--color-accent-l-400) / 0.5);

        --shadow-accent: hsl(var(--color-accent-h) 95% 54% / 0.1);

        /* Notes View Theming - "Sun-kissed Parchment" */
        --paper-color: rgba(252, 249, 243, 0.85); /* Very light cream */
        --line-color: rgba(224, 215, 203, 0.9); /* Soft brown lines */
        --paper-text-color: #5c554e; /* Gentle brown for notes */
        --paper-text-bold: var(--accent-600);
        --paper-text-italic: var(--accent-600);
        --paper-text-underline: var(--accent-600);
        --paper-placeholder: #a8a29a; /* Warm gray placeholder */
        
        /* Browser View Bubbles */
        --user-bubble-bg: var(--accent-100);
        --user-bubble-text: var(--accent-600);
      }

      /* Custom Fonts & Global Styles */
      body {
        font-family: 'Inter', sans-serif;
        color: var(--text-secondary);
        position: relative;
        overflow: hidden; /* Prevent body scrollbars */
      }
      .font-mono {
        font-family: 'JetBrains Mono', monospace;
      }

      /* Background Image & Overlay */
      body::before {
        content: '';
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background-image: url('https://images.unsplash.com/photo-1500534623283-312aade485b7?q=80&w=2670&auto=format&fit=crop');
        background-size: cover;
        background-position: center;
        z-index: -1;
        transition: filter 0.5s ease-in-out;
      }
      .theme-dark body::before {
        filter: brightness(0.6) saturate(0.9);
      }
      .theme-light body::before {
        filter: brightness(1.0) saturate(1.1);
      }
      
      /* --- Intro Animation Styles --- */
      @keyframes draw-path {
        from { stroke-dashoffset: 1000; }
        to { stroke-dashoffset: 0; }
      }

      @keyframes fill-in {
        from { fill-opacity: 0; stroke-opacity: 1; }
        to { fill-opacity: 1; stroke-opacity: 0; }
      }

      @keyframes assemble-piece {
        from { opacity: 0; transform: translateY(15px) scale(0.9); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }

      @keyframes shoot-out {
          from { opacity: 0; transform: scaleY(0.5); }
          to { opacity: 1; transform: scaleY(1); }
      }

      @keyframes reveal-text {
          from { opacity: 0; transform: translateY(10px); letter-spacing: 6px; }
          to { opacity: 1; transform: translateY(0); letter-spacing: 2px; }
      }

      #intro-logo svg * { transform-origin: center center; }

      #intro-logo #crest-main-shape,
      #intro-logo #crest-inner-shape {
          fill-opacity: 0;
          stroke: var(--accent-300);
          stroke-width: 1.5;
          stroke-dasharray: 1000;
          stroke-dashoffset: 1000;
          animation: 
              draw-path 1.2s cubic-bezier(0.65, 0, 0.35, 1) forwards,
              fill-in 0.7s ease-out forwards;
      }
      #intro-logo #crest-main-shape { animation-delay: 0s, 1.2s; }
      #intro-logo #crest-inner-shape { animation-delay: 0.15s, 1.35s; }
      #intro-logo #eye-group { opacity: 0; animation: assemble-piece 0.8s cubic-bezier(0.23, 1, 0.32, 1) 1.6s forwards; }
      #intro-logo #light-rays-group { transform-origin: bottom center; }
      #intro-logo #light-rays-group path { opacity: 0; animation: shoot-out 0.5s cubic-bezier(0.23, 1, 0.32, 1) forwards; }
      #intro-logo #light-rays-group path:nth-child(1) { animation-delay: 2.3s; }
      #intro-logo #light-rays-group path:nth-child(2) { animation-delay: 2.1s; }
      #intro-logo #light-rays-group path:nth-child(3) { animation-delay: 2.3s; }
      #intro-logo #logo-text { opacity: 0; animation: reveal-text 1.0s cubic-bezier(0.23, 1, 0.32, 1) 2.5s forwards; }
      
      /* --- Transition from Intro to App --- */
      @keyframes fade-out {
        from { opacity: 1; }
        to { opacity: 0; pointer-events: none; }
      }
      .animate-fadeOut { animation: fade-out 0.8s cubic-bezier(0.65, 0, 0.35, 1) forwards; }

      @keyframes fade-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      .animate-fadeIn { animation: fade-in 0.8s cubic-bezier(0.23, 1, 0.32, 1) both; }
      
      /* View & Content Animations */
      @keyframes viewFadeIn {
        from {
          opacity: 0;
          transform: translateY(1rem) scale(0.98);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
      .animate-viewFadeIn { animation: viewFadeIn 0.5s cubic-bezier(0.23, 1, 0.32, 1) both; }

      @keyframes futuristicModalOpen {
        from { opacity: 0; transform: perspective(800px) translateY(50px) rotateX(-15deg) scale(0.95); filter: blur(8px); }
        to { opacity: 1; transform: perspective(800px) translateY(0) rotateX(0deg) scale(1); filter: blur(0); }
      }
      .animate-futuristicModalOpen { animation: futuristicModalOpen 0.5s cubic-bezier(0.23, 1, 0.32, 1) both; }

      @keyframes backdropFadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      .animate-backdropFadeIn { animation: backdropFadeIn 0.5s cubic-bezier(0.23, 1, 0.32, 1) both; }

      /* Texture Overlay for dark mode */
      .theme-dark .texture-overlay {
        position: relative;
        /* background-color: var(--bg-secondary); */ /* No longer needed */
      }
      .theme-dark .texture-overlay::before {
        content: "";
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.02'/%3E%3C/svg%3E");
        pointer-events: none;
        z-index: 0;
      }

      /* Notes View Paper Background */
      .paper-background {
        --line-height: 1.75rem;
        background-color: var(--paper-color);
        backdrop-filter: blur(10px);
        background-image: 
          repeating-linear-gradient(
              to bottom,
              transparent,
              transparent calc(var(--line-height) - 1px),
              var(--line-color) calc(var(--line-height) - 1px),
              var(--line-color) var(--line-height)
          );
        background-size: 100% var(--line-height);
        background-position-y: 0.75rem;
        line-height: var(--line-height);
        color: var(--paper-text-color);
      }
      
      .paper-background b, .paper-background strong { color: var(--paper-text-bold); }
      .paper-background i, .paper-background em { color: var(--paper-text-italic); }
      .paper-background u { text-decoration-color: var(--paper-text-underline); text-decoration-thickness: 1.5px; }

      .editor-placeholder:empty::before {
        content: attr(data-placeholder);
        color: var(--paper-placeholder);
        position: absolute;
        pointer-events: none;
        user-select: none;
        left: 1.5rem;
        top: 0.75rem;
      }

      /* Markdown Renderer Theming */
      .markdown-strong { color: var(--accent-300); }
      .markdown-em { color: var(--accent-200); }
      .theme-light .markdown-strong,
      .theme-light .markdown-em { color: var(--accent-600); }

    </style>
<script type="importmap">
{

</script>
</head>
